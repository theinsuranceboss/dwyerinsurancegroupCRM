<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dwyer Insurance Group - Leads Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #191825;
      --muted: #747185;
      --line: #e6e3ee;
      --soft: #f7f5fb;
      --gold: #FAC000;
      --gold-hover: #e5ad00;
      --shadow: 0 18px 55px rgba(25, 20, 42, .12);
      --radius-xl: 24px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #ede7ff 0%, #f9f7ff 35%, #f1ecff 100%);
      font-family: "Manrope", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* LOGIN SCREEN STYLES */
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-shell {
      width: min(880px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      border: 4px solid rgba(255, 255, 255, .8);
      border-radius: 28px;
      overflow: hidden;
      background: white;
      box-shadow: var(--shadow);
    }

    /* LEFT BRAND PANEL (CENTERED & BIGGER LOGO) */
    .login-brand {
      padding: 48px 36px;
      color: white;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .brand-logo-container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand-logo-img {
      max-width: 220px;
      width: 80%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
    }

    /* LOGIN FORM STYLES */
    .login-form-wrap { padding: 44px; display: flex; flex-direction: column; justify-content: center; }
    .field { display: grid; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 11px; font-weight: 800; color: #4c495b; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { 
      width: 100%; 
      height: 46px; 
      border: 1px solid #dddbe5; 
      border-radius: 10px; 
      padding: 0 14px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .btn {
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      padding: 0 20px;
      font-weight: 800;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn-gold { color: var(--ink); background: var(--gold); }
    .btn-gold:hover { background: var(--gold-hover); }
    .btn-ink { color: white; background: var(--ink); }

    /* DASHBOARD LAYOUT */
    .app-shell { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; min-height: 100vh; }
    .sidebar { background: var(--ink); border-radius: var(--radius-xl); padding: 28px 20px; color: white; display: flex; flex-direction: column; }
    .sidebar-logo { max-width: 160px; width: 100%; margin: 0 auto; display: block; }
    .workspace { background: rgba(255,255,255,.95); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow); }

    .nav-btn { 
      width: 100%; 
      height: 46px; 
      border: 0; 
      background: transparent; 
      color: #b9b7c3; 
      text-align: left; 
      padding: 0 16px; 
      font-weight: 700; 
      border-radius: 12px; 
      margin-top: 8px; 
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn.active { background: var(--gold); color: var(--ink); }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { padding: 12px 16px; text-align: left; background: #faf9fb; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; }
    td { padding: 14px 16px; border-top: 1px solid var(--line); font-size: 14px; }

    /* MODAL */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(25, 24, 37, 0.6); 
      backdrop-filter: blur(4px);
      display: grid; place-items: center; z-index: 1000;
    }
    .modal-box { background: white; padding: 32px; border-radius: 20px; width: min(440px, 90%); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-shell">
      <!-- LEFT BRAND PANEL -->
      <div class="login-brand">
        <div class="brand-logo-container">
          <img src="https://lh3.googleusercontent.com/d/1mGDQ-GSjWUqgOBPfiH8YesE3cr5d8dW6" alt="Dwyer Insurance Group Logo" class="brand-logo-img">
        </div>
        <h2 style="font-size: 28px; margin: 0 0 8px 0; font-weight: 800;">Leads Manager</h2>
        <p style="opacity: 0.7; font-size: 13px; margin: 0 0 32px 0;">Sign in to access your administrative workspace.</p>
        <div style="font-size:11px; opacity: 0.4; letter-spacing: 0.5px;">Dwyer Insurance Group ©</div>
      </div>

      <!-- RIGHT FORM PANEL -->
      <div class="login-form-wrap">
        <h3 style="font-size: 20px; margin-top: 0; margin-bottom: 24px;">Sign In</h3>
        <form onsubmit="handleLogin(event)">
          <div class="field">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="dwyer" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <div id="loginError" style="color: #e53e3e; font-size: 13px; margin-bottom: 12px; font-weight: 600;"></div>
          <button type="submit" class="btn btn-gold" style="width:100%;">Access Portal</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar">
      <div>
        <img src="https://lh3.googleusercontent.com/d/1mGDQ-GSjWUqgOBPfiH8YesE3cr5d8dW6" alt="Dwyer Logo" class="sidebar-logo">
      </div>
      <div style="margin-top: 40px;">
        <button class="nav-btn active" id="btnDash" onclick="switchTab('dashboard')"><i class="bi bi-grid-fill"></i> Leads Dashboard</button>
        <button class="nav-btn" id="btnAgents" onclick="switchTab('agents')"><i class="bi bi-people-fill"></i> Agents & Users</button>
      </div>
      <div style="margin-top: auto;">
        <div id="agentProfileName" style="font-size: 14px; font-weight: 700; margin-bottom: 4px;"></div>
        <div id="agentProfileRole" style="font-size: 12px; opacity: 0.6; margin-bottom: 12px;">Administrator</div>
        <button onclick="handleLogout()" class="btn btn-ink" style="width:100%; height:40px;"><i class="bi bi-box-arrow-right" style="margin-right: 8px;"></i> Log Out</button>
      </div>
    </aside>

    <main class="workspace">
      <!-- LEADS TAB -->
      <div id="dashboardView">
        <h2 style="margin-top: 0;">Leads Overview</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>Company</th><th>Source</th><th>Assigned Agent</th></tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>

      <!-- AGENTS TAB -->
      <div id="agentsView" hidden>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 style="margin: 0;">Agents & System Users</h2>
          <button class="btn btn-gold" onclick="openAddAgentModal()">+ Add New User</button>
        </div>
        <table>
          <thead>
            <tr><th>Full Name</th><th>Username</th><th>Email</th><th>Role</th></tr>
          </thead>
          <tbody id="agentsBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- ADD AGENT MODAL -->
  <div id="agentModal" class="modal-backdrop" hidden>
    <div class="modal-box">
      <h3 style="margin-top: 0; margin-bottom: 20px;">Add New System User</h3>
      <form onsubmit="handleSaveAgent(event)">
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="newAgentName" placeholder="John Doe" required>
        </div>
        <div class="field">
          <label>Username</label>
          <input type="text" id="newAgentUsername" placeholder="jdoe" required>
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="newAgentEmail" placeholder="jdoe@dwyerinsurancegroup.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="newAgentPassword" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>Role</label>
          <select id="newAgentRole">
            <option value="seller">Sales Agent</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div style="display:flex; gap:12px; margin-top:24px;">
          <button type="button" class="btn" style="background:#f0edf5; color: var(--ink);" onclick="closeAddAgentModal()">Cancel</button>
          <button type="submit" class="btn btn-gold" style="flex:1;">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/dwyerinsurancegroup.com/s/AKfycbyFlUiaNMutlDBKg9TaGcrbTf3qlsRuKtTxjaitbMaECWEXQN2Pkt5T1Ec12chbJ8kF7Q/exec';
    let currentSession = null;

    async function apiCall(action, data = {}) {
      const payload = { action, token: currentSession ? currentSession.token : null, ...data };
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      document.getElementById('loginError').innerText = '';

      try {
        const res = await apiCall('login', { username, password });
        if (res.ok) {
          currentSession = res;
          document.getElementById('loginScreen').hidden = true;
          document.getElementById('appShell').hidden = false;
          document.getElementById('agentProfileName').innerText = res.user.name;
          loadData();
        } else {
          document.getElementById('loginError').innerText = res.error || 'Authentication failed.';
        }
      } catch (err) {
        document.getElementById('loginError').innerText = 'Connection error. Ensure your script is deployed to "Anyone".';
      }
    }

    async function loadData() {
      const res = await apiCall('bootstrap');
      if (res.ok) {
        renderLeads(res.contacts || []);
        renderAgents(res.sellers || []);
      }
    }

    function renderLeads(contacts) {
      document.getElementById('leadsBody').innerHTML = contacts.length ? contacts.map(c => `
        <tr>
          <td><strong>${c.name}</strong></td>
          <td>${c.company || '—'}</td>
          <td>${c.source || 'Direct'}</td>
          <td>${c.owner || 'Unassigned'}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center; color: var(--muted);">No leads currently recorded.</td></tr>';
    }

    function renderAgents(agents) {
      document.getElementById('agentsBody').innerHTML = agents.length ? agents.map(a => `
        <tr>
          <td><strong>${a.name}</strong></td>
          <td><code>${a.username}</code></td>
          <td>${a.email}</td>
          <td>${a.role === 'admin' ? 'Administrator' : 'Agent'}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" style="text-align:center; color: var(--muted);">No agents registered.</td></tr>';
    }

    function switchTab(tab) {
      document.getElementById('dashboardView').hidden = (tab !== 'dashboard');
      document.getElementById('agentsView').hidden = (tab !== 'agents');
      document.getElementById('btnDash').classList.toggle('active', tab === 'dashboard');
      document.getElementById('btnAgents').classList.toggle('active', tab === 'agents');
    }

    function openAddAgentModal() { document.getElementById('agentModal').hidden = false; }
    function closeAddAgentModal() { document.getElementById('agentModal').hidden = true; }

    async function handleSaveAgent(e) {
      e.preventDefault();
      const data = {
        name: document.getElementById('newAgentName').value,
        username: document.getElementById('newAgentUsername').value,
        email: document.getElementById('newAgentEmail').value,
        password: document.getElementById('newAgentPassword').value,
        role: document.getElementById('newAgentRole').value
      };

      const res = await apiCall('saveAgent', { data });
      if (res.ok) {
        alert('User successfully created.');
        closeAddAgentModal();
        loadData();
      } else {
        alert('Error: ' + res.error);
      }
    }

    function handleLogout() {
      currentSession = null;
      document.getElementById('appShell').hidden = true;
      document.getElementById('loginScreen').hidden = false;
    }
  </script>
</body>
</html>
