<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dwyer Insurance Group - Leads Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --ink: #191825;
      --muted: #747185;
      --line: #e6e3ee;
      --gold: #FAC000;
      --gold-hover: #e5ad00;
      --shadow: 0 18px 55px rgba(25, 20, 42, .12);
      --radius-xl: 24px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: linear-gradient(145deg, #ede7ff 0%, #f9f7ff 35%, #f1ecff 100%);
      font-family: "Manrope", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* LOGIN SCREEN STYLES */
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-shell {
      width: min(880px, 100%);
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      border: 4px solid rgba(255, 255, 255, .8);
      border-radius: 28px;
      overflow: hidden;
      background: white;
      box-shadow: var(--shadow);
    }

    .login-brand {
      padding: 48px 36px;
      color: white;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .brand-logo-img {
      max-width: 220px;
      width: 80%;
      height: auto;
      object-fit: contain;
      margin-bottom: 24px;
    }

    .login-form-wrap { padding: 44px; display: flex; flex-direction: column; justify-content: center; }
    .field { display: grid; gap: 6px; margin-bottom: 16px; }
    .field label { font-size: 11px; font-weight: 800; color: #4c495b; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select { 
      width: 100%; height: 46px; border: 1px solid #dddbe5; border-radius: 10px; padding: 0 14px; font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: var(--gold); }

    .btn {
      height: 46px; display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 10px; padding: 0 20px; font-weight: 800; font-size: 14px;
      transition: background-color 0.2s;
    }
    .btn-gold { color: var(--ink); background: var(--gold); }
    .btn-gold:hover { background: var(--gold-hover); }
    .btn-ink { color: white; background: var(--ink); }

    /* APP LAYOUT */
    .app-shell { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; min-height: 100vh; }
    .sidebar { background: var(--ink); border-radius: var(--radius-xl); padding: 28px 20px; color: white; display: flex; flex-direction: column; }
    .sidebar-logo { max-width: 180px; width: 100%; margin: 0 auto; display: block; }
    .workspace { background: rgba(255,255,255,.95); border-radius: var(--radius-xl); padding: 32px; box-shadow: var(--shadow); overflow-x: auto; }

    /* TABLE DESIGN */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
    th { padding: 12px 14px; text-align: left; background: #faf9fb; font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.5px; border-bottom: 2px solid var(--line); }
    td { padding: 14px; border-top: 1px solid var(--line); vertical-align: middle; }
    .badge-type { background: #eef2ff; color: #4338ca; padding: 4px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; font-size: 11px; }
    .badge-status { background: #ecfdf5; color: #047857; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-shell">
      <div class="login-brand">
        <img src="https://lh3.googleusercontent.com/d/1mGDQ-GSjWUqgOBPfiH8YesE3cr5d8dW6" alt="Dwyer Logo" class="brand-logo-img">
        <h2 style="font-size: 28px; margin: 0 0 8px 0; font-weight: 800;">Leads Manager</h2>
        <p style="opacity: 0.7; font-size: 13px; margin: 0 0 32px 0;">Sign in to access your administrative workspace.</p>
        <div style="font-size:11px; opacity: 0.4;">Dwyer Insurance Group ©</div>
      </div>

      <div class="login-form-wrap">
        <h3 style="font-size: 20px; margin-top: 0; margin-bottom: 24px;">Sign In</h3>
        <form onsubmit="handleLogin(event)">
          <div class="field">
            <label>Username</label>
            <input type="text" id="loginUsername" placeholder="dwyer" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
          </div>
          <div id="loginError" style="color: #e53e3e; font-size: 13px; margin-bottom: 12px; font-weight: 600;"></div>
          <button type="submit" class="btn btn-gold" style="width:100%;">Access Portal</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="appShell" class="app-shell" hidden>
    <aside class="sidebar">
      <img src="https://lh3.googleusercontent.com/d/1mGDQ-GSjWUqgOBPfiH8YesE3cr5d8dW6" alt="Dwyer Logo" class="sidebar-logo">
      
      <div style="margin-top: 40px; background: rgba(255,255,255,0.05); padding: 14px; border-radius: 12px; text-align: center;">
        <i class="bi bi-shield-check" style="font-size: 24px; color: var(--gold);"></i>
        <div style="font-size: 13px; font-weight: 700; margin-top: 6px;">WebLeads Connected</div>
        <div style="font-size: 11px; opacity: 0.5;">Zapier Live Sync</div>
      </div>

      <div style="margin-top: auto;">
        <div id="agentProfileName" style="font-size: 14px; font-weight: 700; margin-bottom: 4px;">Suzanne Dwyer</div>
        <div id="agentProfileRole" style="font-size: 12px; opacity: 0.6; margin-bottom: 12px;">Administrator</div>
        <button onclick="handleLogout()" class="btn btn-ink" style="width:100%; height:40px; border: 1px solid rgba(255,255,255,0.2);"><i class="bi bi-box-arrow-right" style="margin-right: 8px;"></i> Log Out</button>
      </div>
    </aside>

    <main class="workspace">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h2 style="margin: 0;">Incoming Leads</h2>
          <p style="margin: 4px 0 0 0; color: var(--muted); font-size: 13px;">Real-time stream from WebLeads sheet</p>
        </div>
        <button class="btn btn-ink" onclick="loadData()"><i class="bi bi-arrow-clockwise" style="margin-right:6px;"></i> Refresh</button>
      </div>
      
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Lead Name</th>
            <th>Contact Info</th>
            <th>Zip</th>
            <th>Insurance Type</th>
            <th>Status</th>
            <th>Assigned Agent</th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/dwyerinsurancegroup.com/s/AKfycbyFlUiaNMutlDBKg9TaGcrbTf3qlsRuKtTxjaitbMaECWEXQN2Pkt5T1Ec12chbJ8kF7Q/exec';
    let currentSession = null;

    async function apiCall(action, data = {}) {
      const payload = { action, token: currentSession ? currentSession.token : null, ...data };
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await apiCall('login', { username, password });
        if (res.ok) {
          currentSession = res;
          document.getElementById('loginScreen').hidden = true;
          document.getElementById('appShell').hidden = false;
          if (res.user && res.user.name) {
            document.getElementById('agentProfileName').innerText = res.user.name;
          }
          loadData();
        } else {
          document.getElementById('loginError').innerText = res.error || 'Authentication failed.';
        }
      } catch (err) {
        document.getElementById('loginError').innerText = 'Connection error.';
      }
    }

    async function loadData() {
      try {
        const res = await apiCall('bootstrap');
        if (res.ok) {
          renderLeads(res.contacts || []);
        } else {
          console.error("API Error:", res.error);
        }
      } catch (e) {
        console.error("Error loading data:", e);
      }
    }

    function formatDate(rawDate) {
      if (!rawDate) return '—';
      try {
        const d = new Date(rawDate);
        return isNaN(d.getTime()) ? String(rawDate) : d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
      } catch (e) {
        return String(rawDate);
      }
    }

    function renderLeads(contacts) {
      const tbody = document.getElementById('leadsBody');
      if (!contacts.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color: var(--muted);">No leads found in WebLeads.</td></tr>';
        return;
      }

      tbody.innerHTML = contacts.map(c => `
        <tr>
          <td style="white-space:nowrap; font-size:12px; opacity:0.8;">${formatDate(c.date)}</td>
          <td><strong>${c.firstName} ${c.lastName}</strong></td>
          <td>
            <div>${c.email}</div>
            <div style="font-size:12px; color:var(--muted);">${c.phone}</div>
          </td>
          <td>${c.zip || '—'}</td>
          <td><span class="badge-type">${c.type || 'N/A'}</span></td>
          <td><span class="badge-status">${c.status || 'New'}</span></td>
          <td>${c.agent || 'Unassigned'}</td>
        </tr>
      `).join('');
    }

    function handleLogout() {
      currentSession = null;
      document.getElementById('appShell').hidden = true;
      document.getElementById('loginScreen').hidden = false;
    }
  </script>
</body>
</html>
